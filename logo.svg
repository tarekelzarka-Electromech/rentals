<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5E7E"/>
      <stop offset=".45" stop-color="#8E5CF7"/>
      <stop offset="1" stop-color="#1E7BFF"/>
    </linearGradient>
    <radialGradient id="glow1" cx=".85" cy=".12" r=".55"><stop offset="0" stop-color="#FFC94A" stop-opacity=".95"/><stop offset="1" stop-color="#FFC94A" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx=".1" cy=".95" r=".5"><stop offset="0" stop-color="#2EE6C5" stop-opacity=".8"/><stop offset="1" stop-color="#2EE6C5" stop-opacity="0"/></radialGradient>
    <linearGradient id="b1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2EE6C5"/><stop offset="1" stop-color="#34C759"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5AC8FA"/><stop offset="1" stop-color="#007AFF"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF9F0A"/><stop offset="1" stop-color="#FF2D55"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2a0a5e" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow1)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow2)"/>
  <!-- house -->
  <g filter="url(#sh)">
    <path d="M512 196 L828 452 Q842 464 842 482 L842 790 Q842 828 804 828 L220 828 Q182 828 182 790 L182 482 Q182 464 196 452 Z" fill="#fff"/>
  </g>
  <!-- chimney-free roofline accent -->
  <path d="M512 196 L828 452" stroke="#fff" stroke-width="0"/>
  <!-- bars -->
  <rect x="298" y="610" width="104" height="150" rx="26" fill="url(#b1)"/>
  <rect x="460" y="520" width="104" height="240" rx="26" fill="url(#b2)"/>
  <rect x="622" y="420" width="104" height="340" rx="26" fill="url(#b3)"/>
  <!-- trend arrow -->
  <path d="M300 560 L458 456 L560 498 L700 360" fill="none" stroke="#1d1d1f" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <path d="M640 352 L712 348 L708 420" fill="none" stroke="#1d1d1f" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
</svg>
